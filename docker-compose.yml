services:
  camilalash-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    container_name: camilalash_management_system
    restart: unless-stopped
    ports:
      - "${PORT:-8181}:80"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=80
      - DATA_DIR=/app/data
