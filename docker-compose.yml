version: '3.8'

services:
  camilalash-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    container_name: camilalash_management_system
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
